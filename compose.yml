services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: cvplatform-db
    environment:
      POSTGRES_DB: cvplatform
      POSTGRES_USER: cvplatform
      POSTGRES_PASSWORD: cvplatform
    ports:
      - "5434:5432"
    volumes:
      - cvplatform_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvplatform -d cvplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cvplatform_pgdata:
