services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hirelydesk
      POSTGRES_USER: hirelydesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelydesk -d hirelydesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: ${ALLOWED_HOST:?ALLOWED_HOST must be set}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=hirelydesk;Username=hirelydesk;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      Seed__DemoPassword: ${DEMO_PASSWORD:?DEMO_PASSWORD must be set}
      Database__SkipMigrate: "false"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Facebook__AppId: ${FACEBOOK_APP_ID:-}
      Authentication__Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
      B2__Region: ${B2_REGION:?B2_REGION must be set}
      B2__BucketName: ${B2_BUCKET_NAME:?B2_BUCKET_NAME must be set}
      B2__ApplicationKeyId: ${B2_APPLICATION_KEY_ID:?B2_APPLICATION_KEY_ID must be set}
      B2__ApplicationKey: ${B2_APPLICATION_KEY:?B2_APPLICATION_KEY must be set}
      B2__KeyPrefix: ${B2_KEY_PREFIX:-users}
      B2__PresignedUrlLifetimeSeconds: ${B2_PRESIGNED_URL_LIFETIME_SECONDS:-300}
      B2__DownloadUrlLifetimeSeconds: ${B2_DOWNLOAD_URL_LIFETIME_SECONDS:-60}
      B2__MaxUploadBytes: ${B2_MAX_UPLOAD_BYTES:-5242880}
      Gmail__Address: ${GMAIL_ADDRESS:-}
      Gmail__AppPassword: ${GMAIL_APP_PASSWORD:-}
      Gmail__FromName: ${GMAIL_FROM_NAME:-Hirely Desk}
      Gmail__RequireConfirmedAccount: ${GMAIL_REQUIRE_CONFIRMED_ACCOUNT:-false}
    ports:
      - "127.0.0.1:5192:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application_logs:/app/logs
      - application_dataprotection:/home/app/.aspnet/DataProtection-Keys

volumes:
  postgres_data:
  application_logs:
  application_dataprotection:
