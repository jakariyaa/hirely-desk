services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hirelydesk
      POSTGRES_USER: hirelydesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelydesk -d hirelydesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: hirelydesk.jakariya.eu.org
      ConnectionStrings__Default: "Host=db;Port=5432;Database=hirelydesk;Username=hirelydesk;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      Seed__DemoPassword: ${DEMO_PASSWORD:?DEMO_PASSWORD must be set}
      Database__SkipMigrate: "false"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Facebook__AppId: ${FACEBOOK_APP_ID:-}
      Authentication__Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__UploadPreset: ${CLOUDINARY_UPLOAD_PRESET:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Cloudinary__Folder: ${CLOUDINARY_FOLDER:-cvplatform}
      Gmail__Address: ${GMAIL_ADDRESS:-}
      Gmail__AppPassword: ${GMAIL_APP_PASSWORD:-}
      Gmail__FromName: ${GMAIL_FROM_NAME:-Hirely Desk}
      Gmail__RequireConfirmedAccount: ${GMAIL_REQUIRE_CONFIRMED_ACCOUNT:-false}
    ports:
      - "127.0.0.1:5192:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application_logs:/app/logs

volumes:
  postgres_data:
  application_logs:
